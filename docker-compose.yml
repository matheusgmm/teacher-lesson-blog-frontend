services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    image: teacher-lesson-blog-frontend:local
    container_name: teacher-lesson-blog-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
